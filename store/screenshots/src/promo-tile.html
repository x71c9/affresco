<!doctype html>
<!--
  Small promo tile (440x280) for the Chrome Web Store, rendered by
  scripts/store-images. Affresco is Italian for fresco: the logo lit on a
  plaster wall painted in "giornate", the daily patches a fresco is made of,
  like the pieces of a page joined into one capture.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    width: 440px;
    height: 280px;
    margin: 0;
    overflow: hidden;
  }

  body {
    position: relative;
    background: #0d0c0b;
    font-family: "IBM Plex Mono", monospace;
    color: #ffffff;
  }

  #wall {
    position: absolute;
    inset: 0;
  }

  .halo {
    position: absolute;
    left: 110px;
    top: -14px;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 240, 220, 0.2) 0%, rgba(255, 240, 220, 0.05) 45%, transparent 70%);
  }

  .logo {
    position: absolute;
    left: 160px;
    top: 36px;
    width: 120px;
    height: 120px;
    filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.55));
  }

  .name {
    position: absolute;
    left: 0;
    right: 0;
    top: 196px;
    text-align: center;
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1;
  }
</style>
</head>
<body>
<svg id="wall" width="440" height="280" viewBox="0 0 440 280"></svg>
<div class="halo"></div>
<img class="logo" src="../../../.github/logo-dark.svg" alt="">
<div class="name">Affresco</div>
<script>
  // Fixed seed: the same wall on every render
  let seed = 11;
  const random = () => {
    seed = (seed * 16807) % 2147483647;
    return seed / 2147483647;
  };
  const wall = document.getElementById('wall');
  const line = (points, opacity) => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    p.setAttribute('points', points.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' '));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', '#f3e6d4');
    p.setAttribute('stroke-width', '0.9');
    p.setAttribute('stroke-opacity', opacity.toFixed(2));
    wall.append(p);
  };
  // Seams of the giornate: uneven rows, each split by uneven vertical joints
  let y = 0;
  while (y < 280) {
    const h = 46 + random() * 30;
    const row = [];
    for (let x = -10; x <= 450; x += 30) row.push([x, y + h + (random() - 0.5) * 8]);
    line(row, 0.07 + random() * 0.06);
    let x = random() * 90;
    while (x < 440) {
      const top = y + (random() - 0.5) * 6;
      line([[x, top], [x + (random() - 0.5) * 10, top + h / 2], [x + (random() - 0.5) * 12, y + h]], 0.05 + random() * 0.06);
      x += 70 + random() * 110;
    }
    y += h;
  }
</script>
</body>
</html>
